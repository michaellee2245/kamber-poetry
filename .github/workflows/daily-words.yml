name: Daily words

on:
  schedule:
    # 05:15 UTC = 12:15 a.m. EST / 1:15 a.m. EDT. GitHub cron can run late.
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never run two at once (e.g. a manual run during the scheduled one).
concurrency:
  group: daily-words
  cancel-in-progress: false

jobs:
  fetch-words:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # The script has no npm dependencies, so no install step is needed.
      # It skips the write if today's file already exists.
      - name: Fetch today's words
        run: node scripts/fetch-words.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/words
          if git diff --cached --quiet; then
            echo "No new words to commit."
            exit 0
          fi
          git commit -m "chore: words for $(TZ=America/New_York date +%F)"
          git push
